services:
  - type: web
    name: ai-resume-architect-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LANG
        value: en_US.UTF-8
      - key: LANGUAGE
        value: en_US:en
      - key: LC_ALL
        value: en_US.UTF-8